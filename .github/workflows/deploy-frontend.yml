# ──────────────────────────────────────────────────────────────────────────────
# Deploy Frontend → GitHub Pages — WellnessMitra
#
# Builds the React app and deploys to GitHub Pages automatically.
# The live site will be at: https://<username>.github.io/WellnessMitra
#
# Required GitHub Secrets:
#   REACT_APP_API_URL  → Your deployed backend URL (e.g. https://wellnessmitra-api.onrender.com)
#
# Setup Steps (one-time):
#   1. Go to Repository → Settings → Pages
#   2. Set Source = "GitHub Actions"
#   3. Add secret: REACT_APP_API_URL = https://your-backend-url.onrender.com
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy Frontend → GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:   # Allow manual trigger

# Grant GITHUB_TOKEN the permissions for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages-deployment
  cancel-in-progress: true

env:
  NODE_VERSION: "18"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: ⚛️ Build React App
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: 🔨 Build production bundle
        working-directory: frontend
        env:
          # Point to your deployed backend
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          # Required for GitHub Pages subdirectory hosting
          PUBLIC_URL: /WellnessMitra
          CI: false
        run: npm run build

      - name: 🔧 Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/

  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 📋 Deployment summary
        run: |
          echo "### 🌐 Frontend Deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "**Live URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend API:** ${{ secrets.REACT_APP_API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
