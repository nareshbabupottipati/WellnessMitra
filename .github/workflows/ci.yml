# ──────────────────────────────────────────────────────────────────────────────
# CI Pipeline — WellnessMitra
# Runs on every push to main/master and on all Pull Requests
# Jobs: lint · backend-tests · frontend-build
# ──────────────────────────────────────────────────────────────────────────────

name: CI — Test & Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  backend-lint-and-test:
    name: 🐍 Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx flake8

      - name: 🔍 Lint with flake8
        run: |
          flake8 backend/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=backend/__pycache__,backend/venv
        continue-on-error: true  # Non-blocking for now

      - name: ✅ Run backend tests
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          EDAMAM_APP_ID: ${{ secrets.EDAMAM_APP_ID }}
          EDAMAM_APP_KEY: ${{ secrets.EDAMAM_APP_KEY }}
          DATABASE_URL: sqlite:///./test_fitness.db
          CORS_ORIGINS: http://localhost:3000
        run: |
          cd backend
          python -c "from config import GOOGLE_API_KEY; print('✅ Config loaded')"
          python -c "from database.db import engine; print('✅ DB engine OK')"
        # pytest tests/ -v --tb=short  ← uncomment once test files are added

  # ────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: ⚛️ Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: 🔨 Build React app
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'http://localhost:8000' }}
          CI: false   # Treat warnings as warnings, not errors
        run: npm run build

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  docker-build-check:
    name: 🐳 Docker — Build Check
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test]

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image (no push)
        run: |
          docker build -f Dockerfile -t wellnessmitra-backend:ci .
          echo "✅ Docker build successful"
