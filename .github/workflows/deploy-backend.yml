# ──────────────────────────────────────────────────────────────────────────────
# Deploy Backend — WellnessMitra
#
# Strategy: Deploy to Render (primary) with Docker image push to GHCR
# Triggers: Push to main/master after CI passes
#
# Required GitHub Secrets:
#   RENDER_API_KEY        → Render Dashboard → Account → API Keys
#   RENDER_SERVICE_ID     → Render Service URL: /services/<this-id>
#   GOOGLE_API_KEY        → Google AI Studio
#   GOOGLE_MAPS_API_KEY   → Google Cloud Console
#   EDAMAM_APP_ID         → Edamam Developer Portal
#   EDAMAM_APP_KEY        → Edamam Developer Portal
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy Backend → Render

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:   # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/wellnessmitra-backend

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push-docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: ⚡ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Image build summary
        run: |
          echo "### 🐳 Docker Image Built & Pushed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────────────
  deploy-to-render:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    environment:
      name: production
      url: https://wellnessmitra-api.onrender.com

    steps:
      - name: 🚀 Trigger Render deployment
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys")

          echo "Render API response code: $RESPONSE"

          if [ "$RESPONSE" != "201" ]; then
            echo "❌ Render deploy trigger failed with status $RESPONSE"
            exit 1
          fi

          echo "✅ Render deployment triggered successfully!"

      - name: ⏳ Wait for deployment to complete
        run: |
          echo "Waiting 60 seconds for Render to start the deployment..."
          sleep 60
          echo "Deployment should be in progress. Check Render dashboard for status."

      - name: 🏥 Health check
        run: |
          MAX_RETRIES=10
          RETRY_DELAY=30
          URL="https://wellnessmitra-api.onrender.com/health"

          echo "Running health check on $URL"
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")

            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed! App is live."
              break
            fi

            if [ "$i" = "$MAX_RETRIES" ]; then
              echo "⚠️ Health check timed out — deployment may still be starting."
            else
              echo "Status: $STATUS — retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

      - name: 📋 Deployment summary
        run: |
          echo "### 🚀 Backend Deployed to Render" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL:** https://wellnessmitra-api.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "**API Docs:** https://wellnessmitra-api.onrender.com/docs" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
