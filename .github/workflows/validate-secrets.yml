# ──────────────────────────────────────────────────────────────────────────────
# GitHub Actions Secrets Setup Guide — WellnessMitra
# Go to: Repository → Settings → Secrets and variables → Actions → New secret
# ──────────────────────────────────────────────────────────────────────────────

name: 🔑 Secrets Validation Check

on:
  workflow_dispatch:
    inputs:
      check_mode:
        description: "What to validate"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend-secrets
          - frontend-secrets

jobs:
  validate-secrets:
    name: 🔑 Validate Required Secrets
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Check backend secrets
        if: ${{ github.event.inputs.check_mode == 'all' || github.event.inputs.check_mode == 'backend-secrets' }}
        run: |
          MISSING=()

          [ -z "${{ secrets.GOOGLE_API_KEY }}"      ] && MISSING+=("GOOGLE_API_KEY")
          [ -z "${{ secrets.GOOGLE_MAPS_API_KEY }}" ] && MISSING+=("GOOGLE_MAPS_API_KEY")
          [ -z "${{ secrets.EDAMAM_APP_ID }}"       ] && MISSING+=("EDAMAM_APP_ID")
          [ -z "${{ secrets.EDAMAM_APP_KEY }}"      ] && MISSING+=("EDAMAM_APP_KEY")
          [ -z "${{ secrets.RENDER_API_KEY }}"      ] && MISSING+=("RENDER_API_KEY")
          [ -z "${{ secrets.RENDER_SERVICE_ID }}"   ] && MISSING+=("RENDER_SERVICE_ID")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "❌ Missing backend secrets:"
            printf '   - %s\n' "${MISSING[@]}"
            echo ""
            echo "📖 Add them at: Settings → Secrets and variables → Actions"
            exit 1
          else
            echo "✅ All backend secrets are set!"
          fi

      - name: ✅ Check frontend secrets
        if: ${{ github.event.inputs.check_mode == 'all' || github.event.inputs.check_mode == 'frontend-secrets' }}
        run: |
          MISSING=()

          [ -z "${{ secrets.REACT_APP_API_URL }}" ] && MISSING+=("REACT_APP_API_URL")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "❌ Missing frontend secrets:"
            printf '   - %s\n' "${MISSING[@]}"
            exit 1
          else
            echo "✅ All frontend secrets are set!"
          fi

      - name: 📋 Secrets reference
        run: |
          echo "## 🔑 Required GitHub Secrets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend Secrets" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Where to Get |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`GOOGLE_API_KEY\` | [Google AI Studio](https://aistudio.google.com) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`GOOGLE_MAPS_API_KEY\` | [Google Cloud Console](https://console.cloud.google.com) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`EDAMAM_APP_ID\` | [Edamam Developer Portal](https://developer.edamam.com) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`EDAMAM_APP_KEY\` | [Edamam Developer Portal](https://developer.edamam.com) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`RENDER_API_KEY\` | [Render Dashboard → Account → API Keys](https://dashboard.render.com/u/apikeys) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`RENDER_SERVICE_ID\` | Render Service URL → copy ID after /services/ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Secrets" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`REACT_APP_API_URL\` | Your Render backend URL (e.g. https://wellnessmitra-api.onrender.com) |" >> $GITHUB_STEP_SUMMARY
